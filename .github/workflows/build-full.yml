# 构建"完整包"（全量刷机包）中的 userdata.bin
#
# 产物：项目根目录 userdata.bin（UBIFS 镜像，已含新编译的 udx710 后端 + www 前端）
# 用途：替换官方完整包（udx710-full-<VERSION>）中的 userdata.bin，
#       再用 spd_dump / install.bat 全量刷机。system.bin 等厂商固件不在此 workflow 范围内。
#
# userdata 原厂镜像来源（三选一，按优先级）：
#   1. 手动触发时填写 userdata_url：原厂 userdata.bin 的直链下载地址
#   2. 仓库根目录提交 userdata.bin 文件
#   3. 仓库内已提交 userdata/ 目录树（已用 ubireader_extract_files 提取好的）
# 都不提供则 workflow 直接报错。
#
# UBIFS 参数（-m / -e / -c）默认 2048 / 126976 / 516，来自原作者对原镜像的取值；
# 建议先用 ubireader_display_info 查看原厂 userdata.bin 的实际参数并在手动触发时覆盖。

name: Build Full Package (userdata.bin)

on:
  workflow_dispatch:
    inputs:
      use_upx:
        description: 'build with upx'
        required: false
        type: boolean
        default: true
      userdata_url:
        description: '原厂 userdata.bin 直链下载地址（可留空；留空则用仓库根目录的 userdata.bin，再没有则用仓库内 userdata/ 目录树）'
        required: false
        type: string
        default: ''
      min_io_size:
        description: 'UBIFS 最小 I/O 单元大小 -m，默认 2048（建议用 ubireader_display_info 从原镜像核对）'
        required: false
        type: string
        default: '2048'
      leb_size:
        description: 'UBIFS 逻辑擦除块大小 -e，默认 126976'
        required: false
        type: string
        default: '126976'
      max_leb_cnt:
        description: 'UBIFS 最大逻辑擦除块数量 -c，默认 516'
        required: false
        type: string
        default: '516'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-full:
    name: Build Full Package (userdata.bin)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - name: Install UPX
        if: inputs.use_upx == true
        run: |
          sudo apt-get install -y upx-ucl
          upx --version

      - name: Install mtd-utils and ubireader
        run: |
          sudo apt-get install -y mtd-utils
          python3 -m pip install --break-system-packages ubireader
          mkfs.ubifs --version
          ubireader_extract_files --help >/dev/null 2>&1 || true

      - name: Validate version numbers
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BACKEND_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' backend/Cargo.toml | head -n 1)
          FRONTEND_VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' frontend/package.json | head -n 1)

          echo "VERSION=$VERSION"
          echo "backend/Cargo.toml=$BACKEND_VERSION"
          echo "frontend/package.json=$FRONTEND_VERSION"

          if [ "$BACKEND_VERSION" != "$VERSION" ]; then
            echo "backend/Cargo.toml version does not match VERSION"
            exit 1
          fi

          if [ "$FRONTEND_VERSION" != "$VERSION" ]; then
            echo "frontend/package.json version does not match VERSION"
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          cache-targets: true
          cache-all-crates: true

      - name: Build backend (aarch64-unknown-linux-musl)
        working-directory: backend
        run: |
          echo "🦀 构建后端 (aarch64-unknown-linux-musl)..."

          export CC_AARCH64_UNKNOWN_LINUX_MUSL=musl-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export SQLITE3_STATIC=1
          export LIBSQLITE3_SYS_USE_PKG_CONFIG=0

          cargo build --locked --release --target aarch64-unknown-linux-musl

          BINARY_PATH="target/aarch64-unknown-linux-musl/release/udx710"

          echo "后端构建完成:"
          ls -lh "$BINARY_PATH"
          file "$BINARY_PATH"

      - name: Compress binary with UPX
        if: inputs.use_upx == true
        run: |
          BINARY_PATH="backend/target/aarch64-unknown-linux-musl/release/udx710"

          echo "使用 UPX 压缩..."
          BEFORE_SIZE=$(stat -c%s "$BINARY_PATH")

          upx --best --lzma "$BINARY_PATH"

          AFTER_SIZE=$(stat -c%s "$BINARY_PATH")
          RATIO=$(echo "scale=1; 100 - ($AFTER_SIZE * 100 / $BEFORE_SIZE)" | bc)

          echo "压缩完成，节省 ${RATIO}%"
          ls -lh "$BINARY_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          echo "🎨 构建前端..."
          pnpm install --frozen-lockfile --prefer-offline
          pnpm run build

          echo "前端构建完成:"
          ls -lh dist/

      - name: Prepare userdata source
        run: |
          echo "准备 userdata 源..."

          # 优先级 1: 手动触发时提供的直链
          if [ -n "${{ inputs.userdata_url }}" ]; then
            echo "从 URL 下载原厂 userdata.bin: ${{ inputs.userdata_url }}"
            curl -fsSL -o userdata.bin "${{ inputs.userdata_url }}"
            ls -lh userdata.bin
          fi

          # 优先级 2: 仓库根目录的 userdata.bin
          if [ ! -f userdata.bin ]; then
            if [ -f "$GITHUB_WORKSPACE/userdata.bin" ]; then
              echo "使用仓库根目录的 userdata.bin"
              ls -lh userdata.bin
            fi
          fi

          # 优先级 3: 仓库内已提取的 userdata/ 目录树
          if [ ! -f userdata.bin ] && [ ! -d userdata ]; then
            echo "❌ 错误: 未找到 userdata 源。请三选一:"
            echo "  1. 手动触发时填写 userdata_url 直链"
            echo "  2. 在仓库根目录提交 userdata.bin"
            echo "  3. 在仓库内提交已提取的 userdata/ 目录树"
            exit 1
          fi

          if [ -f userdata.bin ]; then
            echo "原厂 userdata.bin 信息:"
            ls -lh userdata.bin
            md5sum userdata.bin
            ubireader_display_info userdata.bin || true
          else
            echo "使用仓库内 userdata/ 目录树（跳过提取）"
            find userdata -maxdepth 2 -type d | head -20
          fi

      - name: Extract UBIFS userdata tree
        if: hashFiles('userdata.bin') != '' && !hashFiles('userdata/**')
        run: |
          echo "提取 UBIFS 目录树..."
          ubireader_extract_files -o userdata userdata.bin
          echo "提取完成，顶层结构:"
          find userdata -maxdepth 2 | head -30

      - name: Package userdata.bin
        id: package
        run: |
          echo "=========================================="
          echo "  打包 UBIFS 镜像 (userdata.bin)"
          echo "=========================================="
          echo ""

          # pack-userdata.sh: 复制新构建的后端+前端到 userdata/home/root，再 mkfs.ubifs 打包
          ./scripts/pack-userdata.sh \
            --min-io=${{ inputs.min_io_size }} \
            --leb-size=${{ inputs.leb_size }} \
            --max-leb=${{ inputs.max_leb_cnt }}

          echo ""
          echo "校验新镜像:"
          ls -lh userdata.bin
          md5sum userdata.bin
          ubireader_display_info userdata.bin || true

          echo "userdata_file=userdata.bin" >> "$GITHUB_OUTPUT"
          echo "userdata_md5=$(md5sum userdata.bin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "userdata_size=$(stat -c%s userdata.bin)" >> "$GITHUB_OUTPUT"

      - name: Upload userdata.bin
        uses: actions/upload-artifact@v6
        with:
          name: udx710-full-${{ steps.version.outputs.version }}-userdata
          path: userdata.bin
          retention-days: 90
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: userdata.bin
          body: |
            ## 完整包 userdata.bin

            **版本**: ${{ steps.version.outputs.version }}
            **Commit**: ${{ github.sha }}
            **构建时间**: ${{ github.event.repository.updated_at }}
            **UBIFS**: -m ${{ inputs.min_io_size }} -e ${{ inputs.leb_size }} -c ${{ inputs.max_leb_cnt }}

            ### 刷机说明

            1. 下载本 Release 的 `userdata.bin`
            2. 用它替换官方完整包 `udx710-full-${{ steps.version.outputs.version }}` 中的 `userdata.bin`（`system.bin`、fdl、驱动等保持原厂不动）
            3. 短接模块进入 U2S 模式，运行 `install.bat`（或手动 spd_dump）全量刷机
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          {
            echo "## 完整包构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 版本 | ${{ steps.version.outputs.version }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| 架构 | aarch64-unknown-linux-musl |"
            echo "| UPX 压缩 | ${{ inputs.use_upx }} |"
            echo "| UBIFS (-m/-e/-c) | ${{ inputs.min_io_size }} / ${{ inputs.leb_size }} / ${{ inputs.max_leb_cnt }} |"
            echo ""
            echo "### 产物"
            echo "- \`${{ steps.package.outputs.userdata_file }}\` (${{ steps.package.outputs.userdata_size }} 字节)"
            echo "- MD5: \`${{ steps.package.outputs.userdata_md5 }}\`"
            echo ""
            echo "### 刷机步骤"
            echo "1. 下载产物 userdata.bin"
            echo "2. 替换官方完整包 udx710-full-${{ steps.version.outputs.version }} 中的 userdata.bin"
            echo "3. 短接进入 U2S 模式，运行 install.bat 全量刷机"
          } >> "$GITHUB_STEP_SUMMARY"
